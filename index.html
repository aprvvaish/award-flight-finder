<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AwardFlight Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-4xl font-bold mb-2">AwardFlight Finder</h1>
    <p class="text-gray-400 mb-8">Find the best award seats like seats.aero</p>

    <!-- Search Form -->
    <div class="bg-gray-900 rounded-2xl p-6 mb-8">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
        <input id="from" type="text" placeholder="From (e.g. BOM)" 
               class="bg-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="to" type="text" placeholder="To (e.g. JFK)" 
               class="bg-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="date" type="date" 
               class="bg-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="cabin" class="bg-gray-800 rounded-xl px-4 py-3">
          <option value="business">Business</option>
          <option value="first">First</option>
          <option value="economy">Economy</option>
        </select>
        <button onclick="searchAwards()" 
                class="bg-blue-600 hover:bg-blue-700 rounded-xl font-medium flex items-center justify-center gap-2">
          <i class="fas fa-search"></i> Search Awards
        </button>
      </div>
    </div>

    <!-- Results -->
    <div id="loading" class="hidden text-center py-12">
      <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
      <p>Searching award availability...</p>
    </div>

    <div id="results" class="hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-semibold" id="result-title"></h2>
        <button onclick="setAlert()" class="text-blue-400 hover:text-blue-300">
          <i class="fas fa-bell"></i> Set Alert
        </button>
      </div>
      <table class="w-full">
        <thead>
          <tr class="border-b border-gray-700 text-left">
            <th class="py-3">Flight</th>
            <th>Times</th>
            <th>Duration</th>
            <th>Program</th>
            <th class="text-right">Points</th>
            <th class="text-right">Cash</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="results-body" class="text-sm"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function searchAwards() {
      const from = document.getElementById('from').value || 'BOM';
      const to = document.getElementById('to').value || 'JFK';
      const date = document.getElementById('date').value;
      const cabin = document.getElementById('cabin').value;

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');

      try {
        const res = await fetch('http://localhost:3000/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from, to, date, cabin })
        });

        const data = await res.json();

        renderResults(data);
      } catch (err) {
        alert("Backend not running. Start server.js first.");
      }
    }

    function renderResults(data) {
      document.getElementById('loading').classList.add('hidden');
      const container = document.getElementById('results');
      container.classList.remove('hidden');

      document.getElementById('result-title').textContent = 
        `${data.from} → ${data.to} on ${data.date || 'selected date'}`;

      const tbody = document.getElementById('results-body');
      tbody.innerHTML = '';

      data.results.forEach(r => {
        const row = `
          <tr class="border-b border-gray-800 hover:bg-gray-900">
            <td class="py-4">${r.airline} ${r.flight}</td>
            <td>${r.departure} - ${r.arrival}</td>
            <td>${r.duration}</td>
            <td>${r.program}</td>
            <td class="text-right font-semibold">${r.points.toLocaleString()} pts</td>
            <td class="text-right">$${r.cash}</td>
            <td><span class="px-3 py-1 rounded-full text-xs ${r.availability === 'High' ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}">${r.availability}</span></td>
          </tr>`;
        tbody.innerHTML += row;
      });
    }

    function setAlert() {
      alert("Alert feature coming soon! (We'll add email notifications later)");
    }
  </script>
</body>
</html>
